# Site configuration. Zensical is pinned in requirements-docs.txt; see PLAN.md for
# why this engine, and tools/rootcite.py for the citation linking.
#
# Source files under spec/ are deliberately plain CommonMark/GFM. Engine-specific
# syntax is confined to the extensions enabled below, so the corpus stays readable
# on GitHub and portable to another Python-Markdown renderer.

[project]
site_name = "ROOT I/O Specification"
site_description = "A specification of the ROOT on-disk binary formats"
site_url = "https://ariostas.github.io/root-io-spec/"
repo_url = "https://github.com/ariostas/root-io-spec"
repo_name = "ariostas/root-io-spec"
edit_uri = "edit/main/spec/"
docs_dir = "spec"
copyright = "CC-BY-4.0 for the specification, BSD-3-Clause for the tools and the reference files -- see LICENSE"

nav = [
  { "Overview" = "index.md" },
  { "Conventions" = "00-conventions.md" },
  { "Container" = [
      { "File header" = "01-container/FileHeader.md" },
      { "Records and keys" = "01-container/Record.md" },
      { "Directories and key lists" = "01-container/Directory.md" },
      { "Free segments" = "01-container/FreeSegments.md" },
      { "Files larger than 2 GB" = "01-container/LargeFiles.md" },
      { "Compression" = "01-container/Compression.md" },
  ] },
  { "Serialization" = [
      { "Buffer framing" = "02-serialization/Buffer.md" },
      { "Streamer information" = "02-serialization/StreamerInfo.md" },
      { "Element types" = "02-serialization/ElementTypes.md" },
      { "Streamer-driven reading" = "02-serialization/StreamerDriven.md" },
      { "Collections" = "02-serialization/Collections.md" },
      { "Schema evolution" = "02-serialization/SchemaEvolution.md" },
      { "References" = "02-serialization/References.md" },
  ] },
  { "Standard classes" = [
      { "Overview" = "03-classes/index.md" },
      { "TArray" = "03-classes/TArray.md" },
      { "TMap, TExMap and TBtree" = "03-classes/Containers.md" },
      { "TFormula and TF1" = "03-classes/Formula.md" },
      { "TCanvas" = "03-classes/Canvas.md" },
      { "Matrices and vectors" = "03-classes/Matrix.md" },
  ] },
  { "TTree" = [
      { "The tree record" = "04-ttree/TTree.md" },
      { "Branches" = "04-ttree/TBranch.md" },
      { "Split branches" = "04-ttree/TBranchElement.md" },
      { "Splitting" = "04-ttree/Splitting.md" },
      { "Leaves" = "04-ttree/TLeaf.md" },
      { "TBasket" = "04-ttree/TBasket.md" },
      { "Reading entries" = "04-ttree/ReadingEntries.md" },
      { "Auxiliary classes" = "04-ttree/Auxiliary.md" },
  ] },
  { "Writing" = [
      { "Overview" = "06-writing/index.md" },
      { "Writing a file" = "06-writing/WritingFiles.md" },
      { "Writing an object" = "06-writing/WritingObjects.md" },
  ] },
  { "RNTuple" = [
      { "Overview" = "05-rntuple/index.md" },
      { "Binary format specification" = "05-rntuple/BinaryFormatSpecification.md" },
      { "Provenance and sync" = "05-rntuple/UPSTREAM.md" },
      { "Errata" = "05-rntuple/ERRATA.md" },
      { "Implementation notes" = "05-rntuple/NOTES.md" },
  ] },
  { "Appendix" = [
      { "Implementing a reader" = "99-appendix/ReaderChecklist.md" },
      { "Pitfalls" = "99-appendix/Pitfalls.md" },
      { "Bootstrap classes" = "99-appendix/Bootstrap.md" },
      { "Hand-written streamers" = "99-appendix/HandWrittenStreamers.md" },
      { "Forwarding streamers" = "99-appendix/ForwardingStreamers.md" },
      { "Glossary" = "99-appendix/Glossary.md" },
      { "Bibliography" = "99-appendix/Bibliography.md" },
  ] },
]

# The specification's own version, not ROOT's. CHANGELOG.md is the record and
# CITATION.cff carries the same number; spec/index.md states it on the front page.
[project.extra]
version = "0.1.0"
describes_root = "6.40.04"

[project.theme]
# No external font requests: the site should build and serve offline.
font = false
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

# Rewrites `root/...:NN` citations to links at the pinned submodule commit.
# tools/check_pin.py asserts this matches the gitlink; tools/check_citations.py
# asserts each cited file and line actually exists there.
"tools.rootcite".commit = "1211eda93010f26710eafd527d1e66921bffdf8e"
