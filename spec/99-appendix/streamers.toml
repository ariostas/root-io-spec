# Where each class with a fully hand-written `Streamer` is accounted for.
#
# `tools/inventory.py` extracts the class list from the pinned submodule; this
# file says what the project has done about each one, and the tool fails if the
# two disagree in either direction. A submodule bump that adds a hand-written
# `Streamer` therefore fails CI until someone classifies it, and an entry here
# for a class that has since dropped its custom streamer fails too.
#
# status:
#   specified     — `spec` names the document and section that describes the bytes
#   gap           — ROOT writes this class into files and the spec does not
#                   describe it; this is the phase 4 worklist
#   not-persisted — never an object in a file; the `Streamer` is machinery
#   out-of-scope  — ships in ROOT but outside the formats this project specifies
#                   (`PLAN.md` §2.4), recorded so the list stays complete

