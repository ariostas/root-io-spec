name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Checks that need neither ROOT nor the submodule. Fast, and they are the ones
  # a third party re-runs to confirm the fixtures match the specification.
  fixtures:
    name: fixture assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify byte assertions against the committed fixtures
        run: tools/generate.py --check
      - name: Verify the spec's Invariants sections hold for every fixture
        run: tools/check_invariants.py
      # CLAUDE.md requires every published Invariants entry to be checked. This
      # is what enforces it: an entry with no check and no reason in
      # gen/invariants.toml fails here. PLAN.md 8.13.
      - name: Every published invariant is checked or accounted for
        run: tools/check_coverage.py --check
      # Gates 1 and 2 of spec/06-writing/index.md 2: tools/rootwrite.py still
      # reproduces data/written/ byte for byte, and tools/rootfile.py plus the
      # invariants accept what it wrote. Gate 3 needs ROOT and runs below.
      - name: Verify the files tools/rootwrite.py produces
        run: tools/check_write.py
      # The published element lists are read out of the ROOT-written fixtures,
      # so this needs no submodule either: it fails if they drift, if a fixture
      # disagrees with another, if tools/rootwrite.py disagrees with any of
      # them, or if a published list stops producing its own checksum.
      - name: Streamer-info element lists match the reference files
        run: tools/element_lists.py --check

  # Checks that compare spec/ against the pinned ROOT source.
  spec:
    name: spec vs. pinned submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RNTuple specification has not drifted from upstream
        run: tools/sync_rntuple.py --check
      - name: Citation commit matches the pinned submodule
        run: tools/check_pin.py
      - name: Class version tables match ClassDef in the submodule
        run: tools/check_versions.py
      - name: Hand-written Streamer inventory matches the submodule
        run: tools/inventory.py --check
      - name: Cited files and line numbers exist in the submodule
        run: tools/check_citations.py

  # Regeneration needs ROOT, so it is a separate job.
  regenerate:
    name: regenerate fixtures with ROOT
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - name: Install ROOT
        run: |
          # Must match the pinned submodule; see spec/00-conventions.md §1.
          conda install -y -c conda-forge root=6.40.04
      # generate.py is itself the check: it recomputes each fixture's normalized
      # digest and fails on drift. A raw `git diff` over data/ would always
      # differ, since every regeneration writes a fresh TKey timestamp and a
      # fresh TUUID -- which is the reason the digests are normalized at all.
      - name: Regenerate and compare normalized digests
        run: tools/generate.py
      # Gate 3: ROOT opens each file this project wrote, finds the values that
      # went in, and prints no diagnostic. This is the check that makes
      # spec/06-writing/ more than internally consistent.
      - name: ROOT reads the files tools/rootwrite.py produces
        run: tools/check_write.py --root
