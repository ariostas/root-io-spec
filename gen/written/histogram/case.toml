id   = "written/histogram"
file = "data/written/histogram.root"
size = 11627

description = """
A `TH1F` and a `TH1D` written by `tools/rootwrite.py` from
[Writing histograms](../../../spec/06-writing/WritingHistograms.md), with the
fifteen `TStreamerInfo` records the chain needs.

**Every object-bearing record in this file is byte-identical to the one ROOT
wrote in `data/classes/histogram.root`**: the `TH1F`'s 596 bytes, the `TH1D`'s
651, and the `StreamerInfo` record's 9628 -- fifteen infos, every element, every
checksum and every class tag. `tools/test_write.py` asserts all three. The files
differ only in what they are *about*: the directory record's name, the key
timestamps, and the offsets that follow from them.

That is the strongest check in this repository, and it is what the histogram
document rests on. Two caveats it also documents:

* the statistics are **supplied** for `h2`, not derived. `fEntries` counts fills
  and the x moments remember where inside a bin each fill landed, so from binned
  data they cannot be recovered -- for `h1`, where the weights are 1 and the
  fills sit at bin centres, `stats_from_cells` happens to produce ROOT's values
  exactly;
* the Y axis's `fTitleOffset` is 0 while the X and Z axes carry 1. That is
  `gStyle`'s default, not a rule, and it is why the three `TAttAxis` blocks in a
  ROOT-written histogram are not identical.
"""

spec = [
  "spec/06-writing/WritingHistograms.md",
  "spec/06-writing/WritingObjects.md",
]

writer = "tools/rootwrite.py"

