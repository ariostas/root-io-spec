id   = "written/objstring"
file = "data/written/objstring.root"
size = 656

description = """
The smallest complete file written by this project rather than by ROOT: a
header, the root directory record, one `TObjString` record, the key list and the
free list, produced by `tools/rootwrite.py` from
`spec/06-writing/WritingFiles.md`.

`container/file-minimal` is the same shape written by ROOT. Two differences are
deliberate and both are specified:

* there is **no `StreamerInfo` record**, so `fSeekInfo` and `fNbytesInfo` are 0.
  ROOT reads the `TObjString` anyway, from the class it has compiled in
  (`WritingFiles.md` 8); a streamer-info-driven reader cannot, and that
  asymmetry determines what a writer should emit;
* the timestamp and the UUID are fixed inputs, so the file is
  byte-reproducible and `data/written/MANIFEST.sha256` is a plain sha256.

Every assertion below is also a row in a table in `WritingFiles.md`, so the two
check each other.
"""

spec = [
  "spec/06-writing/WritingFiles.md",
  "spec/01-container/FileHeader.md",
  "spec/01-container/Record.md",
  "spec/01-container/Directory.md",
  "spec/01-container/FreeSegments.md",
]

writer  = "tools/rootwrite.py"
datime  = "2000-01-01 00:00:00, fixed; see tools/rootwrite.py DEFAULT_DATIME"

[[records]]
offset = 100
nbytes = 208
class  = "TFile"
role   = "the root directory record"

[[records]]
offset = 308
nbytes = 88
class  = "TObjString"
role   = "application data record"

[[records]]
offset = 396
nbytes = 160
class  = "TFile"
role   = "keys list; located via the root directory's fSeekKeys"

[[records]]
offset = 556
nbytes = 100
class  = "TFile"
role   = "free segments; located via fSeekFree"

[[keys]]
