# ROOT files too large to download, read by HTTP range request instead.
#
# root.cern serves `Accept-Ranges: bytes`, so the header and the free-segment
# record of a multi-gigabyte file cost a few hundred bytes each. That covers
# what spec/01-container/ says about the large-file layout: the `+1000000`
# fVersion flag, `units` 8, and the widened key and TFree fields. No committed
# fixture and no other available file covers it (PLAN.md 9.1).
#
# Each entry records what was measured. `tools/fetch_cern.py --headers` re-reads
# the four ranges and checks every field below, so a change in the remote file or
# a regression in tools/rootfile.py shows up as a failure. Nothing is downloaded.
#
# `path` is relative to https://root.cern/files/. A row outside root.cern has `url`
# instead, absolute; each row has exactly one of the two. CERN Open Data serves
# the same range requests with no redirect: take the EOS path from the record's
# root://eospublic.cern.ch//eos/opendata/... URI and prefix https://opendata.cern.ch
# (the /record/<id>/files/<name> form does not serve ranges). PLAN-corpus.md C14.
# `free_small` and `free_large` count the 10-byte and 18-byte TFree entries
# (FreeSegments.md 2.1); their sum must equal `nfree`.
#
# Two more ranges per file since 2026-09-23 (PLAN-corpus.md C16): the top
# directory record at `fbegin` and its key list at `fseekkeys`. `dir_version` is
# that record's version word, `nkeys` and `keys_large` count the key images in
# the list and the wide ones among them, and `max_seekkey` is their largest
# fSeekKey. They check LargeFiles.md 8.6 on ordinary keys, and 8.7.

[[file]]
path        = "lhcb2.root"
why         = "fEND past 4 GB, so a 32-bit offset cannot address the file at all"
root        = "5.26/00"
size        = 4947894760
fversion    = 1052600
units       = 8
fbegin      = 100
fend        = 4947894760
fseekfree   = 4947894637
nbytesfree  = 123
nfree       = 1
free_keylen = 105
free_class  = "TFile"
free_small  = 0
free_large  = 1
sentinel    = [4947894760, 5000000000]
dir_version = 1005
fseekkeys   = 4947894397
nbyteskeys  = 240
nkeys       = 2
keys_large  = 2
max_seekkey = 4945934133

