# Files in the foreign corpus whose invariant failures are not evidence about
# ROOT's format, and the invariants to skip for each.
#
# The corpus is uproot's regression collection (gen/foreign/MANIFEST.sha256), so
# some of it was written by third-party writers rather than by ROOT. A file that
# a third party wrote incorrectly must not be allowed to weaken an invariant --
# but it must not be allowed to hide behind a weakened invariant either, which is
# why the skip is per file and per invariant, with a reason, rather than a change
# to the check.
#
# The bar for a `skip` entry: the failure has been diagnosed, and the conclusion
# is that the FILE is wrong rather than the specification.
# `tools/check_invariants.py --ignore` reports how many failures each entry
# suppressed, so an entry that stops mattering shows up as suppressing nothing.
#
# A `custom_streamer` entry is a different thing and is not a suppression. It
# names classes in that file whose Streamer is hand-written, so that their
# recorded streamer info does not describe their bytes. StreamerDriven.md 7 says
# a reader cannot discover that from a file and needs a list; CUSTOM_STREAMER in
# tools/rootfile.py is this specification's list of ROOT's own, and this is where
# a *user* class goes. It disables no invariant: the classes named become
# SKIPPED with a reason, and every other branch in the file is still checked.
#
# Nothing here affects `data/`. Our own fixtures are never ignored.

["uproot-issue413.root"]
reason = """
Written by a third party, not ROOT: the tree's branch names (I32, F64, Str,
ArrF64, SliF64) and the file name "struct.root" are uproot's writing-test
fixtures. ROOT opens it and reads all five entries without complaint, so it is
not corrupt -- it is just not written the way ROOT writes.

Two departures, both diagnosed:

  - Its basket keys use fVersion 4, the small-key form. ROOT adds 1000 to a
    basket's key version unconditionally (TBasket.md 1), which is why every
    basket in data/ reads 1004, and a reader that computes fSeekKey's width from
    the version gets four bytes fewer here than ROOT would write. This is the
    only invariant still failing, and it is the file's doing.
  - Its TTree's fLeaves entries wrap each object reference in a byte count.
    ROOT's reader accepts that, so it is now specified rather than rejected:
    Buffer.md 6.1. Recorded here only as the diagnosis.
  - It writes no TStreamerInfo for TLeafI, TLeafD or TLeafC, which ROOT always
    does. Nothing can decode those leaf records from the file alone; that is
    StreamerDriven.md 6's case, caused by the writer. It shows up as NOT CHECKED
    rather than as a failure.
"""
skip = ["TBasket 9.2"]

["uproot-issue261.root"]
reason = """
The record chain has a 70-byte hole: at 10427, where a record header should be,
the first word is 0. ROOT's own walker calls that an error -- TFile::Map prints
"=====E R R O R=======" and abandons the rest of the file
(root/io/io/src/TFile.cxx:1676-1680) -- so this is a defect and not a form the
specification should accommodate.

It does not stop ROOT reading the file, because nothing in TFile::Open walks the
chain: the TTree is reached through fSeekKeys and reads with no complaint.
Record.md 1 now says so. Skipped here because an unwalkable chain stops every
other check on the file, and one defective file must not hide the rest.
"""
skip = ["structure"]

["uproot-issue433-splitlevel2.root"]
reason = """
KM3NeT's Jpp DAQ classes have hand-written Streamers, and their streamer infos
-- which ROOT wrote, and which are in the file -- are fiction. This is exactly
StreamerDriven.md 7, reached for the first time in a *split branch* and in a
user-defined class rather than one of ROOT's own.

KM3NETDAQ::JDAQPreamble is the clearest case. Its recorded info says two base
classes: JDAQAbstractPreamble (two Int_t, and framed, so fourteen bytes) and
TObject. Its branch entry is eight bytes:

    00 00 00 57  00 00 07 d1        length 87, type 2001

-- the two Int_t of the base, raw, with no byte count, no version word, and no
TObject. Nothing in the entry would let a reader work that out.

The diagnosis is not guesswork, because the same entry set contains the control:
KM3NETDAQ::JDAQSummarysliceHeader is also a kBase element on an fType 0 branch
with fStreamerType 0, in the same tree of the same file, and it IS framed --
three nested frames for SummarysliceHeader, JDAQHeader and JDAQChronometer --
and decodes to the byte exactly. So kBase framing is not the issue; these
particular classes are.

Listed rather than skipped, so that the rest of the file is still checked.
"""
custom_streamer = [
  "KM3NETDAQ::JDAQPreamble",
  "KM3NETDAQ::JDAQSummaryFrame",
  "KM3NETDAQ::JDAQSuperFrame",
]

["uproot-issue433-splitlevel4.root"]
reason = """
The same file written at a higher split level; see the entry for
uproot-issue433-splitlevel2.root. The extra splitting reaches one more Jpp
class, KM3NETDAQ::JDAQFrame, whose `buffer` member is a kStreamLoop (501) column
-- that one is framed normally and its extent is checked, so only the classes
below are listed.
"""
custom_streamer = [
  "KM3NETDAQ::JDAQPreamble",
  "KM3NETDAQ::JDAQSummaryFrame",
  "KM3NETDAQ::JDAQSuperFrame",
]

["uproot-from-geant4.root"]
reason = """
Written by g4tools, Geant4's own ROOT writer, not by ROOT: fVersion 40000 with a
2018-2020 fDatime, a zeroed header UUID, and a directory record at version 1001
(Directory.md 7, and the reader bug it exposed in PLAN-review.md R1).

Its TH3 info declares a TAtt3D base and the file carries no TAtt3D info, which is
StreamerDriven.md 10.5. The diagnosis is that the writer is at fault, and it is
not a judgement call: TAtt3D is `ClassDef(TAtt3D,1)`, on neither the hand-written
nor the forwarding list, and 48 files written by ROOT across the two corpora do
carry a TAtt3D info -- an entry with no elements and fCheckSum 0x757a. The
control is tighter than that: six files in the corpora describe a TH3 at all, and
the only two without a TAtt3D info are this one and uproot-issue-250.root. ROOT
records it; g4tools does not.

Nothing else in the file fails, TH3 included: TAtt3D adds no bytes, so the
absence costs a reader nothing here. It would cost one on any class whose
undescribed base is not empty.
"""
skip = ["StreamerDriven 10.5"]

["uproot-issue-250.root"]
reason = """
The same writer and the same single failure as uproot-from-geant4.root; see that
entry for the diagnosis.
"""
skip = ["StreamerDriven 10.5"]
