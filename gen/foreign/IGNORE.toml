# Files in the foreign corpus whose invariant failures are not evidence about
# ROOT's format, and the invariants to skip for each.
#
# The corpus is uproot's regression collection (gen/foreign/MANIFEST.sha256), so
# some of it was written by third-party writers rather than by ROOT. A file that
# a third party wrote incorrectly must not weaken an invariant, and it must not
# hide behind a weakened one either. The skip is therefore per file and per
# invariant, with a reason, rather than a change to the check.
#
# A `skip` entry requires that the failure has been diagnosed and that the FILE,
# not the specification, is wrong. `tools/check_invariants.py --ignore` reports
# how many failures each entry suppressed, and fails on an entry for a checked
# file that suppressed nothing, so an entry that stops mattering cannot stay.
#
# A `custom_streamer` entry is not a suppression. It names classes in that file
# whose Streamer is hand-written, so that their recorded streamer info does not
# describe their bytes. StreamerDriven.md 7 says a reader cannot discover that
# from a file and needs a list; CUSTOM_STREAMER in tools/rootfile.py is this
# specification's list of ROOT's own classes, and a *user* class goes here. It
# disables no invariant: the classes named become SKIPPED with a reason, and
# every other branch in the file is still checked.
#
# Nothing here affects `data/`. Our own fixtures are never ignored.

["uproot-issue413.root"]
reason = """
Written by a third party, not ROOT. Most likely groot, go-hep's ROOT
implementation: rootfilespec's author reports so (GitHub issue #1, item 3), and
the branch names are Go type spellings -- I32, F64, Str, ArrF64 for [N]float64
and SliF64 for a *slice* of float64. Nothing in the bytes names a writer, so this
is corroboration rather than proof. It is certainly not ROOT: every basket key
here has fVersion 4 where ROOT adds 1000 from 4.02 on, and this file's header
names 6.18/04 (see below). ROOT opens it and reads all five entries without
complaint, so it is not corrupt; it is written differently from how ROOT writes.

Three departures, all diagnosed:

  - Its basket keys use fVersion 4, the small-key form. ROOT adds 1000 to a
    basket's key version from release 4.02 onwards (TBasket.md 1), which is why
    every basket in data/ reads 1004, and a reader that computes fSeekKey's width
    from the version gets four bytes fewer here than ROOT would write. This is
    the only invariant still failing, and the file causes it.

    The version qualifier was added on 2026-09-22, and it makes this entry sound
    rather than weaker. Before 4.02 ROOT itself writes small-form basket keys
    (12385 of them in root/roottest/), so a small-form key is not on its own
    evidence about the writer. It is evidence here because the file's header
    names 6.18/04, sixteen years after the boundary. check_invariants.py gates
    TBasket 9.2 on the same header field, so this entry suppresses a failure the
    checker still raises for this file, not one it would have stopped raising
    anyway.
  - Its TTree's fLeaves entries wrap each object reference in a byte count.
    ROOT's reader accepts that, so it is now specified rather than rejected:
    Buffer.md 6.1. Recorded here only as the diagnosis.
  - It writes no TStreamerInfo for TLeafI, TLeafD or TLeafC, which ROOT always
    does. Nothing can decode those leaf records from the file alone; that is
    StreamerDriven.md 6's case, caused by the writer. It shows up as NOT CHECKED
    rather than as a failure.
"""
skip = ["TBasket 9.2"]

["uproot-issue261.root"]
reason = """
The key-list record at 10048 has fNbytes 58 (a header and a count), though the
directory's fNbytesKeys is 106, and fSeekKey 0 rather than its own offset. A
chain walk lands at 10106, on a copy of the TTree key inside the key list, and
that key's fNbytes of 321 carries it to 10427, inside the TTree record, where
the first word is 0. ROOT's own walker treats that as an error: TFile::Map prints
"=====E R R O R=======" and abandons the rest of the file
(root/io/io/src/TFile.cxx:1676-1680). This is a defect, not a form the
specification should accommodate.

It does not stop ROOT reading the file, because nothing in TFile::Open walks the
chain: the TTree is reached through fSeekKeys and reads with no complaint.
Record.md 1 now says so. Skipped here because an unwalkable chain stops every
other check on the file, and one defective file must not hide the rest.
"""
skip = ["structure"]

["uproot-issue433-splitlevel2.root"]
reason = """
KM3NeT's Jpp DAQ classes have hand-written Streamers, and their streamer infos,
which ROOT wrote and which are in the file, do not describe the bytes. This is
StreamerDriven.md 7, reached for the first time in a *split branch* and in a
user-defined class rather than one of ROOT's own.

KM3NETDAQ::JDAQPreamble is the clearest case. Its recorded info lists two base
classes: JDAQAbstractPreamble (two Int_t, and framed, so fourteen bytes) and
TObject. Its branch entry is eight bytes:

    00 00 00 57  00 00 07 d1        length 87, type 2001

These are the two Int_t of the base, raw, with no byte count, no version word
and no TObject. Nothing in the entry would let a reader work that out.

The same entry set contains a control: KM3NETDAQ::JDAQSummarysliceHeader is also
a kBase element on an fType 0 branch with fStreamerType 0, in the same tree of
the same file, and it IS framed (three nested frames for SummarysliceHeader,
JDAQHeader and JDAQChronometer) and decodes to the byte. So kBase framing is not
the issue; these particular classes are.

Listed rather than skipped, so that the rest of the file is still checked.
"""
custom_streamer = [
  "KM3NETDAQ::JDAQPreamble",
  "KM3NETDAQ::JDAQSummaryFrame",
  "KM3NETDAQ::JDAQSuperFrame",
]

["uproot-issue433-splitlevel4.root"]
reason = """
The same file written at a higher split level; see the entry for
uproot-issue433-splitlevel2.root. The extra splitting reaches one more Jpp
class, KM3NETDAQ::JDAQFrame, whose `buffer` member is a kStreamLoop (501)
column. That one is framed normally and its extent is checked, so only the
classes below are listed.
"""
custom_streamer = [
  "KM3NETDAQ::JDAQPreamble",
  "KM3NETDAQ::JDAQSummaryFrame",
  "KM3NETDAQ::JDAQSuperFrame",
]

["uproot-from-geant4.root"]
reason = """
Written by g4tools, Geant4's own ROOT writer, not by ROOT: fVersion 40000 with a
2018-2020 fDatime, a zeroed header UUID, and a directory record at version 1001
(Directory.md 7, and the reader bug it exposed -- PLAN.md 8.13).

Its TH3 info declares a TAtt3D base and the file has no TAtt3D info, which is
StreamerDriven.md 10.5. The writer is at fault: TAtt3D is `ClassDef(TAtt3D,1)`,
on neither the hand-written nor the forwarding list, and 48 files written by ROOT
across the two corpora do have a TAtt3D info, an entry with no elements and
fCheckSum 0x757a. Six files in the corpora describe a TH3 at all, and the only
two without a TAtt3D info are this one and uproot-issue-250.root. ROOT records
it; g4tools does not.

Nothing else in the file fails, TH3 included: TAtt3D adds no bytes, so its
absence costs a reader nothing here. It would on any class whose undescribed
base is not empty.

Its root directory record is also at version 1001, the wide layout, with every
offset under 200 KB. ROOT's TDirectoryFile::FillBuffer widens only when one of
the record's three offsets passes 2 000 000 000 (LargeFiles.md 8.7,
root/io/io/src/TDirectoryFile.cxx:751-759), and every ROOT-written directory
record available agrees with that rule, so this is the writer's choice rather
than a ROOT behaviour. A reader that sizes by the version word, as Directory.md 3
requires, reads it correctly.

Its nine TStreamerSTL elements store fType 300, the real code, where ROOT stores
500 (StreamerInfo.md 10.1). That fails ElementTypes 11.1 and 11.2 and
StreamerInfo 13.9 once per element. ROOT has forced 500 on write since 4.00/01,
and every ROOT-written file available stores 500, 134 elements in twelve files
older than ROOT 5 among them, from 3.04/02 to 4.04/02. These files were exempted
by release ("before ROOT 5") until 2026-09-23, which hid that no ROOT file needed
it.

Its header has nfree 0 over a free list of two entries, FileHeader 10.7, twice:
the count disagrees and it is 0. ROOT never reads nfree, so a reader that walks
the list is unaffected (FileHeader.md 5.4). Every ROOT-written file available,
55 of them older than ROOT 5 back to 2.23/12, has nfree equal to its entry count.
This too was a release exemption until 2026-09-23.
"""
skip = [
  "StreamerDriven 10.5", "LargeFiles 8.7",
  "ElementTypes 11.1", "ElementTypes 11.2", "StreamerInfo 13.9",
  "FileHeader 10.7",
]

["uproot-issue-250.root"]
reason = """
The same writer and the same failures as uproot-from-geant4.root, nine STL
elements at 300 and nfree 0 included; see that entry for the diagnosis.
"""
skip = [
  "StreamerDriven 10.5", "LargeFiles 8.7",
  "ElementTypes 11.1", "ElementTypes 11.2", "StreamerInfo 13.9",
  "FileHeader 10.7",
]
