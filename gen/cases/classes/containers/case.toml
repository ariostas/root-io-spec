id   = "classes/containers"
file = "data/classes/containers.root"
size = 1703

description = """
`TMap`, `TExMap` and `TBtree` -- the three ROOT containers whose `Streamer` is
hand-written at every version, so no streamer info in any file describes their
bytes. `tools/inventory.py` listed them as gaps; this case pins them.

Three things here are not obvious from the source alone.

**A `TMap`'s entries are pointer-streamed, so the second use of an object is a
back-reference.** The map stores one `TObjString` as the value of both pairs. The
first occurrence carries the full class tag (`ff ff ff ff`, then the class name);
the second is four bytes, `00 00 00 78`, an offset into the same buffer. A reader
that treats each slot as a fresh object reads a byte count that is not there.

**A `TExMap` stores the slot index, and the hash it stores is not the hash it was
given.** `Assoc_t::SetHash` forces bit 0 so that a zero hash can mean "free slot",
so the 6 and the 10 this case adds are 7 and 11 on disk. The slot follows from the
stored hash, which puts the four entries in slots 0, 3, 7 and 9. The write loop
walks the table by slot, so the entry added last is the first on disk.
`fSize` (11) is the capacity and `fTally` (4) the count; both are present and they
differ.

**A `TBtree` writes its six shape integers and then one more frame, and that
frame is `TCollection`'s.** `TBtree::Streamer` calls `TSeqCollection::Streamer`,
and `TSeqCollection` is a version-0 class with a plain `#pragma link`. For such
a class `rootcling` generates a `Streamer` that calls its bases and nothing else:
no version word, no byte count, no members. The `00 03` at offset 760 is
therefore `TCollection`'s version, immediately after `TBtree`'s own integers,
with no frame in between. The same rule explains the `TTreePerfStats` record of
`aod_flushed.root`; see Containers.md 6.

`TBtree`'s own version word is 0, at offset 730, so the file also has a
version-0 class other than the one the `serialization/version-zero` case covers.

`TMap` and `TBtree` are `TCollection`s, so `Write()` gives each element its own
key unless `kSingleKey` is passed. That flag appears in no other case here.

The file has one streamer info, for `TObjString`. None of the three containers
contributes one, because none of them calls `WriteClassBuffer`, which is what
puts an info into a file. A hand-written `Streamer` and a recorded streamer info
are independent.
"""

spec = [
  "spec/03-classes/Containers.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

