id   = "classes/tarray"
file = "data/classes/tarray.root"
size = 1237

description = """
The seven concrete TArray classes, one record each.

TArray's streamer is the shortest hand-written one in ROOT: an Int_t count, then
that many values, with no byte count and no version word. Writing each array as a
standalone record makes its whole payload be exactly that, so fObjlen alone pins
the element width: 4 + fN * width, with nothing else in the record.

What this case pins down:

- All seven element widths, including TArrayL's, which is 8 bytes on disk however
  wide `long` is on the writing machine. Its second element, 1234567890, is
  written as 00 00 00 00 49 96 02 d2.
- That there is no framing. The payload begins with the count, not with a byte
  count word, so a reader that expects one reads 0x00000002 as a length.
- That an empty array is four zero bytes and nothing else.
- That ROOT writes **no streamer info for any TArray**. The StreamerInfo record
  here is the 21-byte empty list, so a reader has no choice but to hardcode the
  layout -- which is the whole argument for spec/03-classes/.
"""

spec = [
  "spec/03-classes/TArray.md",
]

