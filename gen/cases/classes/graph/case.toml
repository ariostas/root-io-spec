id   = "classes/graph"
file = "data/classes/graph.root"
size = 14563

description = """
TGraph and TGraphErrors, and what a graph costs a file.

A TGraph is a TNamed plus TAttLine, TAttFill and TAttMarker, then fNpoints and
two counted arrays of doubles, then fFunctions, fHistogram, fMinimum, fMaximum and
fOption. Its attribute values come from the class's own constructor rather than
from gStyle -- TAttFill(0, 1000) is an explicit base initialiser -- so a graph's
line colour is 1 where a histogram's is 602 and its fill style 1000 where a
histogram's is 1001. fBits is 0x400, TGraph::kClipFrame, and **not** the
kMustCleanup a histogram in the same directory carries.

fFunctions is an empty TList, created unconditionally by every constructor and
written as a real object slot with a class record -- fType 64, unlike TH1's
`//->` fType 63 -- and its own fBits are 0.

**fHistogram is why the file has nineteen streamer infos for three small
objects.** It is a TH1F* and it is null in g and gr, but a pointer member drags
the pointee's whole info chain in anyway: TH1F, TH1, TAxis, TAttAxis, THashList
and -- unlike any histogram file -- TArrayF, TArray and TArrayD as well. A file
holding one TGraph and nothing else carries eighteen of them, 11708 bytes of
StreamerInfo record for a 198-byte object.

Object gm shows what happens when the pointer is not null: TGraph::SetMinimum goes
through GetHistogram(), which builds the TH1F, and the record grows from 198 bytes
to 1161. A writer should set the two members and leave fHistogram null, which is
what data/written/graph.root does; ROOT reads the range back from it.

Compression off, so g and gr can be compared byte for byte with the records
tools/rootwrite.py produces.
"""

spec = ["spec/06-writing/WritingGraphs.md", "spec/02-serialization/StreamerDriven.md"]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

