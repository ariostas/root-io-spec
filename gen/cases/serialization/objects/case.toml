id   = "serialization/objects"
file = "data/serialization/objects.root"
size = 2141

description = """
Object-valued members: a TString, a class embedded by value, two pointers to
that class (one set, one null) and a pointer to a TObject-derived class.

The three distinctions this case pins down:

- An embedded object (kAny, 62) gets a byte count and a version word but *no*
  class record: the class is known from the streamer info.
- A pointer (kAnyP, 69 / kObjectP, 64) gets a byte count and a class record,
  because a pointer may refer to a derived class. A null pointer is four zero
  bytes and nothing else.
- kTString (65) has neither byte count nor version word: fStr is a bare counted
  string sitting directly in the member sequence.

fPtr and fNamed differ only in that Inner does not derive from TObject and
TNamed does, which is what selects kAnyP over kObjectP.
"""

spec = [
  "spec/02-serialization/Buffer.md",
  "spec/02-serialization/ElementTypes.md",
]

