id   = "serialization/references"
file = "data/serialization/references.root"
size = 2171

description = """
Object references: a TProcessID record, a referenced TObject, a TRef and a
TRefArray.

The four things this case pins down:

- Referencing an object sets TObject::kIsReferenced (0x10) in its fBits, which
  appends a UShort_t pidf to its TObject base. That base is 12 bytes here, not
  the usual 10, and the streamer info gives no warning: only the bit does.
- The pidf is an index into the file's own key namespace. 0 means the record
  keyed "ProcessID0", whose payload is a bare TNamed whose title is the process
  UUID.
- TRef writes no byte count and no version word of its own. Its 12 bytes are the
  TObject layout above: the version word on the wire is TObject's, not TRef's,
  even though TRef has a ClassDef version of 1.
- TRefArray does have a byte count and a version word, and carries one pidf for
  the whole array followed by a plain UInt_t per entry.

The TProcessID record precedes the object that needs it, because it is written
as a side effect of writing the first reference.

The 36-byte UUID string is masked by tools/normalize.py, which is why this file
has a stable digest despite carrying a fresh UUID on every run.
"""

