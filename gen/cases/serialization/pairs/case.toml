id   = "serialization/pairs"
file = "data/serialization/pairs.root"
size = 3366

description = """
The six shapes a `pair<K,V>` member takes in a member-wise `std::map`, and the
empty case.

`serialization/collections` covers `map<int,int>` and the fact that ROOT wrote no
streamer info for its `pair<int,int>`. This case is the rest of the story, and it
contradicts the simple version of that claim: **whether a file carries a pair's
streamer info is not predictable.** Four of this file's six pairs have one and
two do not, and the split is not by member type. Across both corpora it is 28
present and 23 absent. A reader looks the pair up by name and synthesises only
when it is missing.

One column shape per member:

| Member type | Column of *n* values |
|---|---|
| `std::string` | one shared byte count and version, then *n* counted strings |
| `TString` | *n* counted strings, **no shared frame at all** |
| a class | *n* objects, each with its own byte count and version |
| a collection | one shared frame, then *n* object-wise collections |
| a pointer | *n* object slots |

The `TString` row against the `std::string` row is the one worth reading twice:
the same-looking data, one with a frame and one without, decided only by which
element class the member has.

**fEmpty is the trap.** An empty member-wise collection writes its count and then
nothing -- not even the columns' own headers
(`root/io/io/src/TStreamerInfoReadBuffer.cxx:1197-1199`, where ROOT does nothing
for `!nobjects` above TStreamerInfo version 6). Sixteen bytes for the whole
member. A reader that always reads a column header desynchronises here, and a
reader that never reads one desynchronises on a split branch, where the header
*is* written for an empty column.

**The checksums are not unique.** `pair<int,string>`, `pair<int,vector<short> >`
and `pair<TString,PHit*>` all carry `0x0b5fb752` in this file, in both their
streamer infos and their stream headers. ROOT still reads the file correctly,
because it resolves the value class from the member's declared type name first
and uses the checksum only to pick among that class's own versions. A reader that
looks a pair up by checksum alone will pick the wrong one of these three.
Collections.md 8.2.
"""

spec = [
  "spec/02-serialization/Collections.md",
]

