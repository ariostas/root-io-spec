id   = "serialization/collection-forms"
file = "data/serialization/collection-forms.root"
size = 1669

description = """
Three forms `Collections.md` describes and no file demonstrated: `std::array`, a
fixed array of collections, and a member-wise collection whose value class has a
`ClassDef`.

**`std::array<T,N>` is not a collection.** ROOT maps it to a fixed C array before
the element is built, so `fArrInt` is a `TStreamerBasicType` at code 23
(`kInt + kOffsetL`) and `fArrHit` a `TStreamerObjectAny` at 82. Their bytes are
those of ElementTypes.md 3 and 7.2: three bare `i32` with no prefix, and two
self-framing objects with nothing around them. On disk a `std::array<Int_t,3>`
is indistinguishable from an `Int_t[3]`.

**A fixed array of collections shares one frame.** `std::vector<Int_t>
fVecArr[2]` is a single `bc ver` followed by two complete collections, each with
its own count. It is neither two framed members nor one flattened collection.
The stored `fType` is 500 with `fArrayLength` 2; `kOffsetL` appears only after
the read-time recompute of StreamerInfo.md 10
(`root/core/meta/src/TStreamerElement.cxx:2124-2128`), so **`fArrayLength` is the
only thing in the file that says there are two.** Collections.md 11.1.

**A value class with a `ClassDef` gets a plain version word.** `fHits` is
`vector<CHit>` written member-wise, and its second version word is `00 02`,
`CHit`'s class version, where `serialization/collections`' interpreted `Hit`
gives `00 00` and a checksum. Both forms are legal, and only the file's own
streamer infos tell them apart (Buffer.md 4).

`fCtype` is 61 for `fHits` even though `CHit` does not derive from `TObject`,
another instance of Collections.md 7: `fCtype` does not determine the layout.
"""

