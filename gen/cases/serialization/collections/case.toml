id   = "serialization/collections"
file = "data/serialization/collections.root"
size = 2124

description = """
STL containers: the object-wise and member-wise framings side by side.

Nine members, chosen so that each lands in a different branch of the member-wise
gate. Two are member-wise and six are object-wise, and the difference is a single
bit in the version word.

What this case pins down:

- Every collection member is framed `byteCount version`, where the version is
  TStreamerInfo's own class version, 10. It is not the collection's version and
  not a count.
- kStreamedMemberWise is bit 14 of that version word, so a member-wise frame
  reads 0x400A where an object-wise one reads 0x000A.
- Object-wise is `count` then each element in full. Member-wise is a *second*
  version word for the value class, then `count`, then one column per member of
  the value class: all the x, then all the y.
- A map is a pair-of-columns when member-wise and interleaved key/value when
  object-wise. The value class is pair<K,V>, whose streamer info ROOT does not
  write into the file even though the member-wise frame names its checksum.
- fCtype does not determine the layout. fNested, fWords and fMap all have
  fCtype 61, and they are respectively a nested bare collection, a counted
  string, and a pair. Only fTypeName distinguishes them.
- fSTLtype for std::set is 6, not 5. The shipped ROOT documentation has set and
  multimap the other way round.
- A std::string member is a TStreamerSTLstring: the same frame, then a bare
  counted string with no count and no element loop.

fOne is not a collection. It exists so that Hit's streamer info reaches the file;
without it ROOT writes the vector<Hit> bytes and records nothing about Hit, and
the file cannot be read back even by ROOT.
"""

spec = [
  "spec/02-serialization/Collections.md",
]

