id   = "serialization/version-zero"
file = "data/serialization/version-zero.root"
size = 10557

description = """
TH1L is declared ClassDefOverride(TH1L,0), so its class version really is zero.

This is the case a reader cannot resolve from the bytes alone. A version word of
0 is followed by a 4-byte checksum when the class is foreign, as in
serialization/basic-types -- but TH1L is not foreign, so nothing follows. The
four bytes after the version word here are the byte count of the embedded TH1
base class, and a reader that consumed them as a checksum would be lost.

The disambiguator is the file's own streamer info: the TStreamerInfo for TH1L in
this file has fClassVersion 0, whereas a foreign class is recorded with
fClassVersion 1. See spec/02-serialization/Buffer.md section 4.

Assertions stop after the first few nested bases; the point of the case is the
framing, not TH1's member layout.
"""

spec = [
  "spec/02-serialization/Buffer.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

