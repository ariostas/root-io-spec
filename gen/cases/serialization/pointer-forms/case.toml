id   = "serialization/pointer-forms"
file = "data/serialization/pointer-forms.root"
size = 1656

description = """
Two framing distinctions that a member's declared C++ type does not reveal.

fArrow and fPlainP are both In2*. fArrow carries the `->` annotation, promising
the pointer is never null, so ROOT writes the pointee bare: byte count, version,
and the object, with no class record. fPlainP gets the full object-reference
protocol including a kNewClassTag record. The element types differ accordingly,
68 (kAnyp) and 69 (kAnyP), and only the comment selects between them.

fS1 and fS2 are both TString. The scalar has neither byte count nor version word
and is a bare counted string. The two-element array gets both, and its version
word is 10, TStreamerInfo's own class version, unrelated to TString. A reader that treats 65 and 85 as "the same but repeated" desynchronises
by six bytes.

The trailing Int_t sentinel pins the end of fS2.
"""

spec = [
  "spec/02-serialization/ElementTypes.md",
]

