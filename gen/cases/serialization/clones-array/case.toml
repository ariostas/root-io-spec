id   = "serialization/clones-array"
file = "data/serialization/clones-array.root"
size = 1725

description = """
TClonesArray in both of its encodings, side by side.

TClonesArray predates STL streaming and has its own format. It records its element
class as the text "<class>;<version>", so its elements need a real ClassDef; Pt is
compiled into a dictionary by gen/common/aclic.C before the macro runs. This is the
first case in the repository to need a compiler.

What this case pins down:

- The encoding is chosen by TClonesArray::kBypassStreamer, BIT(12), and that bit is
  written into the TObject base so that the file is self-describing. `bypass` has
  fBits 0x00001000 and `plain` has 0x00000000.
- With the bit set -- the default -- the objects are transposed: one column per
  member of the element class, the TObject base first. There is no second version
  word and no kStreamedMemberWise bit, unlike an STL collection: the element class
  version comes from the "Pt;2" string and the mode from fBits.
- With the bit clear, each slot costs a Char_t flag, and an *empty* slot costs its
  flag too. `plain` has nobjects 2 with slot 0 empty, so its body begins 00 01.
- nobjects is the last occupied index plus one, not the capacity. `plain` was
  constructed with room for 2 and filled only slot 1, and still reports 2.

The bit moved: in TClonesArray class version 3 it was BIT(14), and the class version
was bumped to 4 for no other reason. A reader must check the version before testing
the bit. Only version 4 is reachable here.
"""

spec = [
  "spec/02-serialization/Collections.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

