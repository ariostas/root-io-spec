id   = "serialization/arrays"
file = "data/serialization/arrays.root"
size = 1428

description = """
Fixed-size, multidimensional and variable-length array members.

A fixed-size C array (kOffsetL, 20 + the basic type) is written as its elements
back to back with no count and no prefix of any kind; a two-dimensional array is
indistinguishable on disk from a flat one of the same total length, and only the
streamer info's fArrayDim and fMaxIndex recover the shape.

A variable-length array (kOffsetP, 40 + the basic type) is preceded by a single
byte saying whether the pointer was null. fVar is present, so its flag byte is 1
and three Int_t follow; fMissing is null, so its flag byte is 0 and nothing
follows it at all -- not even a length. Both take their length from fN, which is
an ordinary Int_t marked kCounter (6) in the streamer info.
"""

