id   = "container/file-minimal"
file = "data/container/file-minimal.root"
size = 1094

description = """
One small object (a TObjString) in the root directory of an uncompressed file.
The smallest file that still contains every record a ROOT file must have: the
header, the TFile record, a data record, the StreamerInfo record, the keys list
and the free-segment list.
"""

# Sections of the specification this case is evidence for.
spec = [
  "spec/01-container/FileHeader.md",
  "spec/01-container/Record.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

# Every record in the file, as reported by TFile::Map() and reproduced by
# tools/rootfile.py. Note that the keys-list and free-segments records carry
# fClassName = "TFile" -- they are identified by offset, never by their key.
[[records]]
offset = 100
nbytes = 210
class  = "TFile"
role   = "the root directory record"

[[records]]
offset = 310
nbytes = 88
class  = "TObjString"
role   = "application data record"

[[records]]
offset = 398
nbytes = 434
class  = "TList"
role   = "StreamerInfo; located via fSeekInfo"

[[records]]
offset = 832
nbytes = 161
class  = "TFile"
role   = "keys list; located via the root directory's fSeekKeys"

[[records]]
offset = 993
nbytes = 101
class  = "TFile"
role   = "free segments; located via fSeekFree"

