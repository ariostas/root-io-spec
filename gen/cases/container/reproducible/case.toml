id   = "container/reproducible"
file = "data/container/reproducible.root"
size = 1224

description = """
A file opened with the `?reproducible` URL option, with one subdirectory and one
TObjString. Reproducible mode replaces every timestamp with one sentinel and every
UUID with zeros. The sentinel is not zero and not a 1995 date: it is Unix time 1
packed as local time, whose year wraps in the 6-bit field (Record.md §3.7). The
macro fixes TZ to UTC, where the sentinel is 0x9C420001, 2034-01-01 00:00:01.
It appears twelve times: in the six record keys, in the two key images of the key
list, and as both `fDatimeC` and `fDatimeM` of both directory records.
"""

spec = [
  "spec/01-container/Record.md",
  "spec/01-container/Directory.md",
  "spec/01-container/FileHeader.md",
  "spec/06-writing/WritingFiles.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

[[records]]
offset = 100
nbytes = 200
class  = "TFile"
role   = "the root directory record"

[[records]]
offset = 300
nbytes = 105
class  = "TDirectory"
role   = "the subdirectory record"

[[records]]
offset = 405
nbytes = 88
class  = "TObjString"
role   = "application data record"

[[records]]
offset = 493
nbytes = 434
class  = "TList"
role   = "StreamerInfo; located via fSeekInfo"

[[records]]
offset = 927
nbytes = 201
class  = "TFile"
role   = "keys list; located via the root directory's fSeekKeys"

[[records]]
offset = 1128
nbytes = 96
class  = "TFile"
role   = "free segments; located via fSeekFree"

# ---------------------------------------------------------------------------
# All integers are big-endian. 2621571073 is 0x9C420001: year field 39, month 1,
# day 1, 00:00:01. (70 - 95) mod 64 = 39, so it reads as 2034-01-01 00:00:01.
# ---------------------------------------------------------------------------

# --- File header UUID, spec/01-container/FileHeader.md §6 ------------------
