id   = "rntuple/compressed"
file = "data/rntuple/compressed.root"

# No `size`: 1420 bytes when libc++ wrote it and 1418 when libstdc++ did, for the
# reason `digest_reason` below gives. Every offset asserted here is at or below
# 490, and the divergence is in the StreamerInfo record at 950.

description = """
**A compressed RNTuple page.** Every other RNTuple case here calls
`opts.SetCompression(0)`, and `rntuple/anchor` says why: it keeps the envelopes
readable in place, so the assertions are about the format rather than about a
codec. That was the right call for those cases and it hid something for all of
them. With compression off an `RBlob` payload is stored raw, so
[Compression §9](../../../spec/01-container/Compression.md)'s chain invariants
never run on one. This case turns compression on, which is what RNTuple does by
default, and they do.

**The finding: a sealed page's block chain stops 8 bytes short of its payload.**
The page `RBlob` here is at 381 with `fNbytes` 109 and `fKeylen` 42, so its
payload is 423..490. Its one `ZL` block declares 50 compressed bytes, so the
chain ends at `423 + 9 + 50` = **482**. The eight bytes from 482 to 490 are the
page's XXH3-64 checksum, appended **after** compression and counted **outside**
`fObjLen` -- `kNBytesPageChecksum` is `sizeof(std::uint64_t)`
(`root/tree/ntuple/inc/ROOT/RPageStorage.hxx:74`) and a page is sealed as
`nBytesZipped + nBytesChecksum` (`root/tree/ntuple/src/RPageStorage.cxx:751`).
Assert 482 and 490 together and the gap is the finding, the same way
`rntuple/anchor` asserts 1122 and 1130 for ERRATUM 3.

**What makes it a scope and not an exception**, and the reason this file has four
`RBlob`s rather than one: the header envelope at 234, the page list at 490 and
the footer at 609 all close **flush** with their payloads, and only the page at
381 is short. An envelope's checksum is inside its own declared length; a page's
is not. One record being 8 bytes short would be a curiosity -- three closing
exactly and the fourth not is the distinction, and it is what
`Compression.md` §9.1 states.

**Why `fObjLen` is 2048 and not the file's size**: it is the *uncompressed* page,
512 entries of `std::int32_t`. The values run in blocks of 64 so that zlib has
runs to find; 512 distinct values would be stored raw and would demonstrate
nothing. zlib rather than RNTuple's default zstd, because §3 already pins the
`ZL` block header and this case is about the framing around it, not the codec.

The block header and the checksum are asserted as bytes because they are
**portable**: the arm64 libstdc++ container writes `5a 4c 08 32 00 00 00 08 00`
and `fb 9e c3 08 fa 1f 77 e6` at the same offsets, identical to libc++. Only the
file's total length differs, and that is the `ROOT::RNTuple` streamer info far
below.
"""

spec = [
  "spec/01-container/Compression.md",
  "spec/05-rntuple/NOTES.md",
]

root_version = "6.40.04"
compression  = { algorithm = "zlib", setting = 101 }

digest        = false
digest_reason = """
`std::uint64_t` resolves to `unsigned long long` with libc++ and `unsigned long`
with libstdc++, so ROOT::RNTuple's seven 64-bit members are recorded as fType 17
`ULong64_t` on one and fType 14 `unsigned long` on the other -- a LENGTH
difference a mask cannot undo, and the whole 2-byte difference in this file's
size. It is in the StreamerInfo record at 950; every byte asserted here is at or
below 490. ElementTypes.md 2.4, PLAN.md 9.6
"""

[[records]]
offset = 100
nbytes = 134
class  = "TFile"
role   = "the root directory record"
[[records]]
offset = 234
nbytes = 147
class  = "RBlob"
role   = "the header envelope -- compressed, and its chain closes flush"
[[records]]
offset = 381
nbytes = 109
class  = "RBlob"
role   = "THE PAGE: one sealed page, whose chain stops 8 bytes short"
[[records]]
offset = 490
nbytes = 119
class  = "RBlob"
role   = "the page list envelope -- closes flush"
[[records]]
offset = 609
nbytes = 118
class  = "RBlob"
role   = "the footer envelope -- closes flush"
[[records]]
offset = 727
nbytes = 113
class  = "ROOT::RNTuple"
role   = "the anchor, compressed -- which rootfile.read_rntuple_anchor cannot read"

