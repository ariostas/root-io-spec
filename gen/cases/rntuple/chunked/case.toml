id   = "rntuple/chunked"
file = "data/rntuple/chunked.root"

# No `size`, for the reason `digest_reason` below gives: the file's length
# differs between libc++ and libstdc++ in the StreamerInfo record at 1936. Every
# offset asserted here is below 1829, where the anchor ends.

description = """
An RNTuple whose payloads are split across several keys. The anchor schema says
a payload bigger than `Max Key Size` "will be written as multiple RBlobs/TKeys,
and the offsets of all but the first RBlob will be written at the end of the
first one". No other file exercises this: every anchor in `data/rntuple/`, in
both corpora and in scikit-hep-testdata keeps the default of 1 GiB
(`root/tree/ntuple/inc/ROOT/RNTupleWriteOptions.hxx:191`). Requested in
issue #6.

`Max Key Size` is 128 here, set with the internal setter ROOT's own
`MiniFile.MultiKeyBlob` test uses, so all five payloads are split: the header,
both pages, the page list and the footer. `NOTES.md` §9 has the layout. In
short:

- The locator, or the anchor's seek, names the **first** chunk, and that chunk
  is exactly `Max Key Size` bytes: data, then one little-endian u64 offset per
  further chunk. Every further chunk is `Max Key Size` bytes but the last.
- The chunk count is **not stored**. It is computed, and it is not
  `ceil(nbytes / max)`: `x`'s page is 256 bytes, exactly two chunks of 128, but
  needs three, because the first gives up 16 bytes to the offsets of the other
  two. Its chunks are 112, 128 and 16 bytes.
- **The first chunk is written last**, so the other chunks lie before it in the
  file. The header's second chunk is at 270 and its first at 439.
- **A page is split by its size with its checksum.** `n`'s page is 124 bytes
  by its locator, under the limit, but 132 with its XXH3 checksum, so it is
  split, and the value 30 and the checksum are in a 12-byte key at 609,
  before the page's first chunk at 663. A reader that compares the locator's
  size with `Max Key Size` reads 124 contiguous bytes from 663 and gets four
  bytes of an `RBlob` key header for its last value.
- The header (247 bytes) needs two chunks, not three, because its 9 spare bytes
  in the second chunk leave room for the single offset: the tightest case of
  the count's rule in this file.

Each joined payload's XXH3-64 checksum was confirmed to match (with `xxhash`,
outside this case), and `rootfile.read_column_values` reads `n` = 0..30 and
`x` = 1000..1030 back through the chunks.

**ROOT 6.40.04 cannot `Show()` this file.** `RNTupleReader::Open` and
`GetView` read both fields correctly, but `Show(0)` throws "page checksum
verification failed". `Show` reads through a cloned page source, and a clone
of an attached source never runs `LoadStructureImpl`, the only place that tells
its reader the key size (`root/tree/ntuple/src/RPageStorageFile.cxx:390`,
`:562-567`, `root/tree/ntuple/src/RPageStorage.cxx:236-245`). The clone reads a
split page as one range. That is a reader bug in ROOT, not a property of the
file; `NOTES.md` §9 records it.

Compression is off so that every chunk is readable in place.
"""

spec = [
  "spec/05-rntuple/NOTES.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }

digest        = false
digest_reason = """
`std::uint64_t` resolves to `unsigned long long` with libc++ and `unsigned long`
with libstdc++, so ROOT::RNTuple's seven 64-bit members are recorded as fType 17
`ULong64_t` on one and fType 14 `unsigned long` on the other: a length
difference a mask cannot undo, in the StreamerInfo record at 1936. Every byte
asserted here is below 1829. ElementTypes.md 2.4, PLAN.md 9.6
"""

