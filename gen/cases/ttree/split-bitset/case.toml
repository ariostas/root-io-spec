# --- one entry, in full ---------------------------------------------------
#
# 40 00 00 16 | 00 0a | 00 00 00 10 | 01 00 01 00 00 01 00 01 01 00 01 00 00 01 00 01
# byte count    ver     count 16      sixteen bools, least significant bit first
#
# 0xA5A5 is 1010 0101 1010 0101, whose bit pattern is symmetric enough that the
# bit order cannot be read off entry 0. Entry 2 settles it: 0xA5A5 >> 2 = 0x2969
# = 0010 1001 0110 1001, and the bytes are its reverse. The order is bit 0
# first, which is bitset::operator[] order and not the order the literal reads
# in.

