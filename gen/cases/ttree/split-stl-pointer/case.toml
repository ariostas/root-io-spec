id   = "ttree/split-stl-pointer"
file = "data/ttree/split-stl-pointer.root"
size = 20784

description = """
Collection members of a split object whose branch's fStreamerType is not the
500 their streamer element stores: 71 for a pointer to a collection, 91 for an
array of such pointers, and 320 for an array of collections.

A `TStreamerSTL` writes fType 500 (kStreamer) whatever the member is
(root/core/meta/src/TStreamerElement.cxx:2146). Its read path computes the code
it uses: kSTLp (71) when the type name ends in `*`, else kSTL (300), plus
kOffsetL (20) when fArrayLength is non-zero
(root/core/meta/src/TStreamerElement.cxx:2124-2128). A member's branch copies
the element's in-memory code when it is built
(root/tree/tree/src/TBranchElement.cxx:351), so it records the computed code,
and the element record in the same file says 500. `ttree/split-nested` has the
plain 300 form; this case has the other three:

    h             fType 0, fID -2      the split node
    h/fPtr        fStreamerType 71     vector<PItem>*
    h/fPtrArr[2]  fStreamerType 91     vector<PItem>*[2]
    h/fArr[2]     fStreamerType 320    vector<PItem>[2]
    h/fFlag       fStreamerType 18     Bool_t

The same rule applies to both halves of a pointer's code. The element's
fSTLtype is 41, kSTLvector plus kOffsetP (40), because the member is a pointer
(root/core/meta/src/TStreamerElement.cxx:1806 and :1870).

`fFlag` is the control: a `Bool_t` member that ROOT 6.40.04 records as 18 on
both the branch and the element. Before 4.03/02 `kBool_t` was 11, the same code
as `kUChar_t` (`v4-02-00:meta/inc/TDataType.h:37`), so both sides said 11.

The entries. None of the three collection branches has sub-branches here, and
each entry is framed once, with the version word 0x400a (kStreamedMemberWise
plus 10) and `PItem`'s class version 1, then the collection bodies:

- `fPtr`: one count, then a column per member of `PItem`. No pointer tag or
  null marker comes before the frame.
- `fPtrArr[2]` and `fArr[2]`: one frame for **both** array elements, then two
  collection bodies back to back, each a count and its columns. The byte count
  covers both bodies.

Three entries, with collections of zero, one and two elements.
"""

spec = [
  "spec/04-ttree/TBranchElement.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }


