id   = "ttree/split-nested"
file = "data/ttree/split-nested.root"
size = 21646

description = """
Three levels of splitting: a class holding a class holding a collection.

NTop holds an NDet, which holds a std::vector<NHit>. That is the shape of a real
physics branch in miniature, and one TTree::Branch call produces seven branches:

  nt                  fType 0, fID -2   the split node
  nt/fDet             fType 2           a class-typed member
  nt/fDet/fNo         fType 0
  nt/fDet/fHits       fType 4           the collection count branch
  nt/fDet/fHits/fId   fType 41
  nt/fDet/fHits/fE    fType 41
  nt/fRun             fType 0

What this case pins down:

- fType 2 is the second interior node type, and like fType 1 it has no leaf --
  its fLeaves is a TObjArray with nobjects 0 -- and no basket. Its fStreamerType
  is 62, kAny.
- The count branch fDet/fHits is fType 4 with fStreamerType 300 (kSTL),
  fClonesName NHit -- the *value* type, not the collection type -- and fMaximum
  2, the largest collection in the file. Its fLeaves has nobjects 1 and that one
  entry is a back-reference, never a leaf written in place.
- **The count relationship is spelled out in the titles.** The count branch's
  title ends in an underscore, `fDet.fHits_`, and each member branch's title
  names it in brackets: `fId[fDet.fHits_]`. BuildTitle constructs both
  (root/tree/tree/src/TBranchElement.cxx:1189,
  root/tree/tree/src/TBranchElement.cxx:1218). The machine-readable form of the
  same relationship is each member's fBranchCount: tag 1189, which against a
  record starting at 791 names position 791 + 1189 - 2 = 1978, the count
  branch's own position.
- fClassName changes as the walk descends -- NTop, then NDet, then NHit -- and
  each time it is the class whose element list that branch's fID indexes.
- **fSplitLevel is not a depth counter.** It reads 99 on the node, 98 on fDet
  and fRun, 97 on fDet/fHits, and **0** on fDet/fNo and on both fType 41
  members, which are at three different depths. The writer decrements it in some
  paths and zeroes it in others (root/tree/tree/src/TBranchElement.cxx:6403-6408,
  root/tree/tree/src/TBranchElement.cxx:6444-6449), so a reader must take the
  structure from the fBranches nesting and never from this number.

Three entries with collections of 2, 0 and 1 elements, so the empty case is
covered, and compression off.
"""

spec = [
  "spec/04-ttree/TBranchElement.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }


