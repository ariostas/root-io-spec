id   = "ttree/split-empty-collection"
file = "data/ttree/split-empty-collection.root"
size = 18858

description = """
Two split collections at split level 99, three entries of 0, 1 and 2 elements,
compression off: `e`, a `std::vector<EHit>` whose value class has no data
members, and `p`, a `std::vector<PHit>` with one.

A split collection's count leaf is created before its sub-branches
(root/tree/tree/src/TBranchElement.cxx:975-996), and each sub-branch leaf
points at it through fLeafCount. TBranch streams fBranches before fLeaves, so
the first sub-branch's leaf writes the count leaf in full and the collection's
own fLeaves entry is a back-reference to it. That is branch `p`. With no data
members there is no sub-branch, nothing writes the leaf first, and the
collection's fLeaves entry is the leaf itself. That is branch `e`.

Written for PLAN-review.md V43. TBranchElement.md invariant 5 said the leaf of
an fType 3 or 4 branch is *always* a back-reference, on a measurement of 105
branches that all had sub-branches. This file, written by ROOT, falsified it.
EHit, PHit and the vectors' dictionaries come from classes.h.
"""

spec = [
  "spec/04-ttree/TBranchElement.md",
]

