id   = "ttree/ntuple"
file = "data/ttree/ntuple.root"
size = 16954

description = """
A TNtuple: a tree whose record is not of class TTree.

TNtuple derives from TTree and adds one member. The key's class name is
"TNtuple", the whole TTree layout sits inside the record as a base class, and
fNvar follows it. A reader therefore cannot find the trees in a file by comparing
the key's class name against "TTree"; it has to know, from the file's own
streamer info, which classes derive from it.

What this case shows:

- The key names the class "TNtuple", and the object data opens with TNtuple's own
  byte count and class version 2, not TTree's.
- The TTree base is a nested framed object: its own byte count and version word
  20, then the whole member list of ttree/tree. A reader that dispatches on the
  key's class name and then applies TTree's streamer info directly is four bytes
  and a version word out of step.
- fNvar is the last member of the record, after every TTree member. fArgs is
  transient and is not on disk.
- TNtuple's three branches are plain TBranch objects holding TLeafF leaves; the
  class adds nothing to them. fTotBytes is 3 x 73.
"""

spec = [
  "spec/04-ttree/TTree.md",
]

