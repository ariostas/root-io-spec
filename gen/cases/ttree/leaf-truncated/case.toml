id   = "ttree/leaf-truncated"
file = "data/ttree/leaf-truncated.root"
size = 17768

description = """
The four ways a truncated floating-point leaf is stored, in one file.

Float16_t (leaflist code `f`) and Double32_t (code `d`) each have a with-factor
form and a truncated-mantissa form, and which applies is decided by the
annotation in the leaf *title* -- not by the leaf class, and not by fLenType,
which stays 4 and 8 whatever ends up on disk.

  a/f            no annotation  ->  3 bytes, mantissa truncated to 12 bits
  b/f[0,100,10]  a real range   ->  4 bytes, a scaled UInt_t
  c/d            no annotation  ->  4 bytes, a plain Float_t
  d/d[0,0,8]     nbits only     ->  3 bytes, mantissa truncated to 8 bits

a and c are the same declaration shape and differ by one byte per entry, in
opposite directions from what the class names suggest. That asymmetry is the
point of the case.

What this case pins down:

- The width is 3, 4, 4, 3 while fLenType is 4, 4, 8, 8. Neither the class nor
  fLenType predicts the on-disk width on its own; only the title does.
- The same asymmetry is inside the leaf record. TLeafF16::fMinimum and fMaximum
  are declared Float16_t with no annotation and occupy three bytes each;
  TLeafD32's are Double32_t with no annotation and occupy four. A reader that
  assumes the two classes are shaped alike desynchronises by two bytes per leaf.
- For 1.5 with nbits 12 the encoding is an exponent byte then a two-byte
  mantissa: 7f 08 00. 0x7f << 23 | (0x0800 & 0x1fff) << 11 is 0x3fc00000.
- For 50.0 in [0,100] with 10 bits the factor is 1024/100 = 10.24 and the stored
  UInt_t is round(50 x 10.24) = 512.
- Every basket here has a fixed entry size and therefore no offset array:
  fNevBufSize is the entry width, 3 or 4, and fObjlen is twice it.
- TLeafF16 and TLeafD32 are at class version 2, which is new in ROOT 6.40. At
  version 1 the title held the type spec alone, with no leaf name and no leading
  slash.
"""

