id   = "ttree/split-tbits"
file = "data/ttree/split-tbits.root"
size = 22217

description = """
An unsigned counter: `TBits::fNbytes` keeps `kUInt` (13) and is never
`kCounter` (6), on the record, on an unsplit branch and on a split one.

`TBits` declares `UInt_t fNbytes;` and `UChar_t *fAllBits; //[fNbytes]`
(root/core/cont/inc/TBits.h:31-32). A counter is promoted to `kCounter` only
when its code is below 6 (root/core/meta/src/TStreamerElement.cxx:99), so this
one stays 13 in the streamer info. A reader that keeps a counter's value only
for code 6 cannot read `fAllBits` on any of the three paths here.

What this case covers:

- The streamer element `fNbytes` is fType 13, and `fAllBits` is fType 51
  (kOffsetP + kUChar) with fCountName `fNbytes`.
- The `bits` record is a `TBits` object read element by element: byte count 24,
  version 1, `TObject`, fNbits 20, fNbytes 3, the flag byte, then 08 00 02 for
  bits 3 and 17.
- The unsplit branch's entries are the members with no byte count and no
  version word for `TBits` (ReadingEntries.md 3.3), and the counter comes
  before the array it counts inside each entry.
- Split, `fNbytes` is a counter branch with **fStreamerType 13**, and
  `fAllBits`'s fBranchCount names it. This is the only counter branch in the
  fixtures whose fStreamerType is not 6 (TBranchElement.md 10.9).
- **fMaximum is 0 on that counter branch.** Only a branch whose fStreamerType
  is `kCounter` is filled through `FillLeavesMemberCounter`
  (root/tree/tree/src/TBranchElement.cxx:5900-5901), which is the one fill
  procedure that updates fMaximum (root/tree/tree/src/TBranchElement.cxx:1758-1759).
  Compare `ttree/split-counter`, whose `kCounter` branch records 3.
- A default `TBits` has 8 bits in one byte (root/core/cont/inc/TBits.h:44), and
  `SetBitNumber` past the end doubles the byte count it needs
  (root/core/cont/inc/TBits.h:191-196). So the split branch's counts, for bits
  0, 9 and 18, are 1, 4 and 4, and fNbits is 8, 10 and 19.
- The `TObject` base splits into `fUniqueID` and `fBits`. `fBits` is kBits (15),
  whose entries are 4 or 6 bytes (ElementTypes.md 2.3), so ROOT gives that
  branch an offset array (root/tree/tree/src/TBranchElement.cxx:357-363)
  although every entry here is 4 bytes.
"""

spec = [
  "spec/02-serialization/ElementTypes.md",
  "spec/02-serialization/StreamerDriven.md",
  "spec/04-ttree/TBranchElement.md",
]

root_version = "6.40.04"
