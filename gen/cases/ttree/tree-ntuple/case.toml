id   = "ttree/tree-ntuple"
file = "data/ttree/tree-ntuple.root"
size = 19406

description = """
TNtuple and TNtupleD: what a TTree subclass adds on disk.

Very little. Each adds one persistent Int_t, fNvar, after the TTree base
(root/tree/tree/inc/TNtuple.h:31, root/tree/tree/inc/TNtupleD.h:31); fArgs is
transient. Their branches are ordinary single-leaf TBranches with TLeafF and
TLeafD leaves respectively.

The case exists for the reason TTree.md section 1 gives: a reader must find
trees by walking the base-class chain, because the key's class name is not
"TTree". Here the two keys say TNtuple and TNtupleD, and both records begin with
a TTree base-class frame at class version 20.

ttree/ntuple already covers a TNtuple on its own. This pairs it with TNtupleD so
that the two class versions (2 and 1) and the TLeafF/TLeafD difference are
visible in one file.
"""

