id   = "ttree/split-dotted-collection"
file = "data/ttree/split-dotted-collection.root"
size = 20760

description = """
One split collection under two branch names, `Branch("v.", ...)` and
`Branch("w", ...)`: a `std::vector<DHit>` at split level 99, one entry.

For a split object a trailing dot changes every name below the branch
(ttree/split-naming). For a top-level split collection it changes nothing:
TBranchElement::Init removes the dot before anything is named
(root/tree/tree/src/TBranchElement.cxx:906-909), so the count branch of the
first is `v`, not `v.`, and both halves have the same shape: `v` titled `v_`,
its leaf `v_`, and members `v.fId` titled `fId[v_]`. The string `v.` never
occurs in the file on its own.

Written for PLAN-review.md V25, which suspected from the source alone that the
dot survived here, because the lines Splitting.md 3.3 cited append the
underscore without removing a dot. The dot had already gone, eighty lines
earlier. DHit and the vector's dictionary come from classes.h.
"""

spec = [
  "spec/04-ttree/Splitting.md",
]

