id   = "ttree/basket-displacement-refs"
file = "data/ttree/basket-displacement-refs.root"
size = 21219

description = """
Back-references inside a moved basket entry, in two circular trees, and ROOT's
defect with them.

Branch `p` holds a DPair unsplit: two TNamed pointers, so the second one's class
tag is a back-reference to the first one's class record in the same entry. A
circular tree moves its surviving entries down the basket and records where each
was in a displacement array; the bytes are moved unchanged, so a tag still names
the position its target had when the entry was written. ROOT adds
fDisplacement = offset - displacement to every tag it reads in the entry
(TBranch.cxx:1739-1744, TBufferFile.cxx:2594 and :2788).

- `once`: 21 fills with SetCircular(20), so one move of three entries. Every
  surviving entry was moved once, its displacement is where it was written, and
  the tag resolves. ROOT reads all 18 entries correctly.
- `twice`: 24 fills, so a second move. MoveEntries overwrites the displacement
  with the offset before the latest move (TBasket.cxx:329), so for entries 6 to
  20 of the fill order it no longer names where the entry was written, and
  nothing in the file does. ROOT 6.40.04 reads 13 of those 15 entries with fB
  null, silently. PLAN.md 7.1 has it as a bug candidate.

DPair comes from classes.h. PLAN-review.md V21.
"""

spec = [
  "spec/04-ttree/ReadingEntries.md",
  "spec/04-ttree/TBasket.md",
]

