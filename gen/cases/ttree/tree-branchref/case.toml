id   = "ttree/tree-branchref"
file = "data/ttree/tree-branchref.root"
size = 19609

description = """
A TBranchRef and its TRefTable: the branch that is not in fBranches.

TTree::BranchRef creates a branch with a fixed identity -- name "TRefTable",
title "List of branch numbers with referenced objects"
(root/tree/tree/src/TBranchRef.cxx:58-59) -- and hangs it off TTree::fBranchRef
rather than adding it to fBranches. Three things follow, and all three are
assertions here.

**It counts towards the tree's byte totals but a walk over fBranches misses
it.** The tree records fTotBytes 546 and fZipBytes 489; the two ordinary
branches sum to 365 and 365. The missing 181 and 124 are the TBranchRef's. This
is why TTree.md invariant 1 has to add fBranchRef by name, and this fixture is
what caught the omission.

**It is compressed in an uncompressed file.** Its constructor hard-codes
fCompress = 1 (root/tree/tree/src/TBranchRef.cxx:62), so it is the only branch
here whose fZipBytes is below its fTotBytes, and its basket is the only one
beginning with a ZL block header while every other basket in the file is raw.

**Its basket is written only because the generator asks.**
TTree::FlushBasketsImpl iterates GetListOfBranches
(root/tree/tree/src/TTree.cxx:5255-5265), which does not contain fBranchRef, so
TTree::Write never flushes it. Without the explicit FlushBaskets() in gen.C the
file has a TBranchRef with fWriteBasket 0 and the references cannot be resolved
at all -- which is what an ordinary small file written by a user looks like.
"""

spec = [
  "spec/04-ttree/Auxiliary.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }


