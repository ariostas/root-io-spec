id   = "ttree/split-counter"
file = "data/ttree/split-counter.root"
size = 19463

description = """
A counted array inside a split object, and the one case where an fType 0 branch
carries an fBranchCount.

`Int_t fN; Float_t *fX; //[fN]` is the oldest variable-length shape in ROOT.
Split, it becomes two sibling branches with a dependency between them, and the
dispatch of TBranchElement.md section 8 sends each to a procedure that appears
nowhere else: fN to ReadLeavesMemberCounter and fX to
ReadLeavesMemberBranchCount. Those are the two rarest rows in either corpus, 2
occurrences and 16.

What this case pins down:

- The counter branch fN is fType 0 with fStreamerType 6, kCounter
  (root/core/meta/inc/TVirtualStreamerInfo.h:132). Nothing else marks it.
- **fMaximum is on the counter**, not on the counted branch: fN records 3, the
  largest count in the file, and fX records 0. The two fType 0 branches with a
  non-zero fMaximum anywhere in the corpora are both kCounter branches, so this
  is the general rule rather than a quirk of the case.
- fX is fStreamerType 45, which is kOffsetP + kFloat -- the counted-pointer form
  of ElementTypes.md section 4 -- and its fBranchCount holds the tag 493. The
  record starts at 592, so that names position 592 + 493 - 2 = 1083, which is
  where fN's branch begins. That off-by-two is kMapOffset, the same arithmetic
  as fLeafCount.
- The relationship is written down three separate times: fX's fBranchCount names
  fN's *branch*, fX's leaf's fLeafCount names fN's *leaf*, and fX's title is the
  text `fX[fN]`. A reader may use any of the three; only the first two are
  machine-readable without parsing.
- fEntryOffsetLen is 12 on fX and 0 on both fixed-width siblings: a branch whose
  entries vary in size needs the offset array of TBasket.md section 5, and one
  whose entries do not needs none.

Three entries with counts of 1, 3 and 2, so the counter is doing real work and
the basket of fX is not a constant stride.
"""

spec = [
  "spec/04-ttree/TBranchElement.md",
]

root_version = "6.40.04"
compression  = { algorithm = "none", setting = 0 }


