# Published `Invariants` entries that `tools/check_coverage.py` cannot match to a
# label in the tools, and what accounts for each.
#
# `AGENTS.md` requires every entry to be checked. That rule was unenforced until
# 2026-09-21; `PLAN.md` §8.13 records that the one entry found to be false was
# also one nobody had wired up. `tools/check_coverage.py --check` fails on an
# unchecked entry that is not listed here, and on a listing that no longer
# applies.
#
# `by` says what accounts for it:
#
#   alias         the same claim is checked under another document's label, named
#                 in `reason`. Common where two documents state one fact.
#   structural    enforced by the reader rather than by a comparison: a wrong
#                 value makes the parse fail, and the failure is reported under
#                 the label in `reason`. Consumption checks are the usual case.
#   write-gate    a spec/06-writing/ entry, checked by tools/check_write.py on
#                 every written file -- gate 1's byte identity with a ROOT-written
#                 file, gate 2's run of check_invariants.py over our own output,
#                 or a WriteError in rootwrite.py. Each write document's
#                 Invariants section says which, and `reason` quotes it.
#   not-checkable no file we can produce or hold exhibits it; why, in `reason`.
#   unchecked     not checked, and could be. This is the worklist, and it
#                 should stay short.
#
# Each `alias` and `structural` claim was verified by finding the check.
# `unchecked` entries are to-dos.

# ---------------------------------------------------------------- container --

[invariant."Compression 9.1"]
by = "structural"
reason = """
The compressed/raw decision itself: `fObjlen > fNbytes - fKeylen` and nothing
else. Every reader path takes the branch from it, so there is no separate value to
compare. Its compressed half is checked as Compression 9.2 to 9.6 and its raw half
by the new 9.7.
"""

[invariant."Directory 9.1"]
by = "structural"
reason = """
`rootfile.read_directory` accepts a record as a directory only when `fSeekDir`
equals the record's own offset, the self-check ROOT itself relies on. A record
that fails it is treated as not a directory rather than as a bad one, so the
failure surfaces as Record 8.6 (keys whose fSeekPdir names no directory) and as
the root directory going missing. Provoked in tools/test_container.py by changing
a version word to 1005.
"""

[invariant."FreeSegments 8.3"]
by = "alias"
reason = "Checked as FileHeader 10.7, which compares `nfree` with the entry count."

[invariant."FreeSegments 8.4"]
by = "alias"
reason = """
Two halves, both checked elsewhere: `fNbytesFree` against the record's `fNbytes`
as FileHeader 10.6, and `fSeekKey` against the record's own offset as Record 8.3,
which applies to every key including this one.
"""

[invariant."FreeSegments 8.8"]
by = "alias"
reason = "The partition of [fBEGIN, fEND) is Record 8.8's walk, which is checked over every file."

[invariant."LargeFiles 8.1"]
by = "alias"
reason = "Restates FileHeader 10.9 for the large case; checked there, including the stricter iff the checker applies."

[invariant."LargeFiles 8.2"]
by = "alias"
reason = "Restates FreeSegments 8.3, checked as FileHeader 10.7."

[invariant."LargeFiles 8.3"]
by = "alias"
reason = "Restates FreeSegments 8.2's trailing-entry rule, checked there."

[invariant."LargeFiles 8.4"]
by = "structural"
reason = """
A free entry's width comes from its own version word, so a wrong flag makes the
parse of the entry after it desynchronise; the garbage that follows fails
FreeSegments 8.5 or 8.1. No value is compared directly because the only way to
know the intended width is to trust the word being checked.
"""

[invariant."LargeFiles 8.5"]
by = "alias"
reason = "Restates FreeSegments 8.5, checked there."

[invariant."LargeFiles 8.6"]
by = "not-checkable"
reason = """
A wide key occurs only in a file past 2 GB, and no fixture is that large.
`gen/cern/LARGE.toml` records the measured header, free-list, top-directory and
key-list facts for eleven files from 1.3 GB to 15.9 GB, fetched by range request
rather than held, with 38 wide keys between them; `fetch_cern.py --headers`
checks this invariant on every one. They are the only evidence for this layout
in the project.
"""

[invariant."Record 8.9"]
by = "alias"
reason = """
Checked as Directory 9.14, which folds the keep flag away with `abs(fCycle)` and so
compares magnitudes as this entry asks.
"""

# ------------------------------------------------------------ serialization --

[invariant."Collections 14.5"]
by = "structural"
reason = """
StreamerDriven 10.2 applied inside a collection, as the document says: a
collection whose decoding does not land on its byte count fails that check, which
`decode_record` reports for every record of every file.
"""

[invariant."Collections 14.8"]
by = "structural"
reason = """
The document states it as a consumption check, and it runs as one: reading a
TClonesArray body with the wrong fBits interpretation desynchronises and the byte
count catches it, reported as StreamerDriven 10.1.
"""

[invariant."References 8.1"]
by = "structural"
reason = """
The TObject base's width is what the streamer-driven read consumes; a wrong choice
between 10 and 12 bytes shifts every member after it and fails StreamerDriven 10.1
or 10.2. `data/serialization/ref-variants` is the fixture that exercises both.
"""

[invariant."StreamerDriven 10.2"]
by = "structural"
reason = """
`decode_record` recurses into every nested object and compares what it consumed
with the byte count as it returns; a mismatch is raised and reported under
StreamerDriven 10.1, so that label covers both.
"""

[invariant."StreamerInfo 13.6"]
by = "alias"
reason = "The same claim as ElementTypes 11.1, checked there for every element of every info."

# ----------------------------------------------------------------- classes --

[invariant."TArray 5.2"]
by = "structural"
reason = """
A TArray's extent is checked by consumption: `4 + fN x width` is what the reader
advances, and a disagreement ends the enclosing object somewhere other than its
byte count, failing StreamerDriven 10.1. TArray.md 5.1, the fN bound, is checked
directly.
"""

# ------------------------------------------------------------------- ttree --

[invariant."Auxiliary 8.4"]
by = "unchecked"
reason = """
A TFriendElement's fTreeName is read only as part of the TTree record's
streamer-driven decode, which checks framing rather than values, and nothing walks
the decoded tree to reach the string. `ttree/tree-friend` is the fixture it would
run on. Cheap to add once a decoded-value accessor exists; on the worklist.
"""

[invariant."ReadingEntries 8.2"]
by = "alias"
reason = "Checked as Splitting 8.2, which the document says is the same invariant seen from the branch side."

[invariant."ReadingEntries 8.6"]
by = "structural"
reason = """
A partial bitset entry would not consume the bytes its span allows, so it fails
ReadingEntries 8.5. The three branch-baskets of `ttree/split-bitset` are all
decoded and checked, so the case is reached rather than skipped.
"""

[invariant."TBasket 9.8"]
by = "structural"
reason = """
`rootfile.read_basket` refuses a basket whose fIOBits is zero after the negative
marker, or sets bit 7, or sets anything outside kSupported -- the same three tests
ROOT makes before marking the basket a zombie. The refusal is reported as
TBasket 9.1.
"""

# ------------------------------------------------------- the write side, 46 --
#
# Every `spec/06-writing/` document's Invariants section already names what
# checks it, and each reason below quotes that document. The mechanism is one of
# three: gate 2 of `tools/check_write.py` runs `check_invariants.py` over our own
# output, so every reading invariant applies to it under the reading label; gate 1
# compares the bytes with a ROOT-written file; or `tools/rootwrite.py` raises a
# WriteError as it writes. A write-side entry has no label of its own by design:
# it states the same fact to the writer.

[invariant."WritingFiles 14.1"]
by = "write-gate"
reason = "§14: checked by check_invariants.py as FreeSegments 8.7, the header/free-list agreement."

[invariant."WritingFiles 14.2"]
by = "write-gate"
reason = "§14: the record walk, checked as Record 8.8 on every written file through gate 2."

[invariant."WritingFiles 14.3"]
by = "write-gate"
reason = "§14, as Directories 9.3 -- a subdirectory's fNbytesName is its own fKeylen."

[invariant."WritingFiles 14.4"]
